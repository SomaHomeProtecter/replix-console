<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:," />
    <title>Replix 조치 콘솔</title>
    <script>
      /* 깊은 주소 복원(HP-456). GitHub Pages는 없는 경로에 docs/404.html을 주고, 404.html은 원래 경로를
         ?p= 에 실어 이 페이지로 보낸다. 모듈이 평가되기 전에 주소를 되돌린다 — env.ts가 모듈 평가 시점에
         ?environment=를 읽고, 싱글파일 빌드는 동적 import까지 즉시 평가해 main.tsx에서 하면 늦다.
         해시(Keycloak 로그인 응답의 code)는 그대로 둔다. */
      (function () {
        var p = new URLSearchParams(location.search).get('p');
        if (p && p.charAt(0) === '/') {
          history.replaceState(null, '', '%BASE_URL%'.replace(/\/$/, '') + p + location.hash);
        }
      })();
      /* 모듈 평가 중 예외(예: 지원하지 않는 ?environment= 값)는 main.tsx의 catch에 닿지 않는다(싱글파일
         빌드). 첫 원인을 전역에 남겨 main.tsx가 그것을 보이게 하고(src/bootGuards.ts), main.tsx까지 못 가면
         흰 화면 대신 여기서 원인을 그린다. 앱이 이미 무언가를 그렸다면 건드리지 않는다. */
      window.addEventListener('error', function (event) {
        if (window.__replixBootError === undefined) window.__replixBootError = event.error || event.message;
        var root = document.getElementById('root');
        if (!root || root.hasChildNodes()) return;
        var box = document.createElement('div');
        box.className = 'boot-error';
        box.textContent = '콘솔 초기화 실패 — ' + (event.message || '알 수 없는 오류');
        root.appendChild(box);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
